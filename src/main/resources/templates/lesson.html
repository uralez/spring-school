<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${lesson.topic}">Lesson</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/leaf.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="container lesson-page">
    <p th:if="${!subject.classes.isEmpty()}" class="no-print">
        <a th:href="@{/subject/{n}/{c}(n=${subject.name},c=${subject.classes[0].className})}"
           th:text="'‹ ' + #{lesson.back}">Back</a>
    </p>

    <p th:if="${isAdmin}" class="no-print">
        <a th:href="@{/admin/lesson/{id}/edit(id=${lesson.id})}" th:text="#{admin.lesson.edit}">Edit</a>
    </p>

    <form th:if="${canEditLesson}" method="post" class="no-print delete-lesson"
          th:action="@{/manage/subject/{sid}/lessons/{lid}/delete(sid=${subject.id},lid=${lesson.id})}"
          th:attr="data-confirm=#{lesson.delete.confirm(${gradeCount})}">
        <button type="submit" class="btn-add-lesson" th:text="#{lesson.delete}">Delete lesson</button>
    </form>
    <script>
        document.querySelectorAll('form[data-confirm]').forEach(function (f) {
            f.addEventListener('submit', function (e) {
                if (!confirm(f.dataset.confirm)) { e.preventDefault(); }
            });
        });
    </script>

    <p class="no-print" th:if="${canEditLesson}">
        <button type="button" id="open-print" class="btn-fill" th:text="#{print.open}">Print sheets</button>
    </p>
    <dialog id="print-dialog" class="prompt-dialog" th:if="${canEditLesson}"
            th:attr="data-subject=${subject.name}, data-class=${subject.classes.isEmpty() ? '' : subject.classes.![className].stream().sorted().findFirst().orElse('')}, data-date=${lesson.plannedDate != null ? #temporals.format(lesson.plannedDate, 'd MMM', enLocale) + '''' + #temporals.format(lesson.plannedDate, 'yy') : ''}, data-topic=${lesson.topic}">
        <h2 th:text="#{print.title}">Print sheets for students</h2>
        <form id="print-form" method="get" target="_blank"
              th:action="@{/manage/lesson/{id}/print(id=${lesson.id})}" class="lesson-form">
            <label for="pr-place" th:text="#{print.place}">Place</label>
            <input id="pr-place" name="place" value="spring-school">
            <label for="pr-subject" th:text="#{print.subject}">Subject</label>
            <input id="pr-subject" name="subject">
            <label for="pr-class" th:text="#{print.class}">Class</label>
            <input id="pr-class" name="className">
            <label for="pr-date" th:text="#{print.date}">Date</label>
            <input id="pr-date" name="date">
            <label for="pr-topic" th:text="#{print.topic}">Lesson topic</label>
            <input id="pr-topic" name="topic">
            <label th:text="#{print.students}">Students</label>
            <div class="print-students">
                <label th:each="s : ${printStudents}" class="print-check">
                    <input type="checkbox" name="studentIds" th:value="${s.id}" checked>
                    <span th:text="${s.user.fullName}"></span>
                </label>
                <label class="print-check">
                    <input type="checkbox" id="pr-blank">
                    <span th:text="#{print.blank}">Blank name</span>
                    <input type="number" id="pr-blank-count" min="1" max="50" value="1" disabled>
                </label>
                <input type="hidden" name="blanks" id="pr-blanks" value="0">
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn-save" th:text="#{print.go}">Open sheets</button>
                <button type="button" id="close-print" th:text="#{print.cancel}">Cancel</button>
            </div>
        </form>
    </dialog>
    <script th:if="${canEditLesson}">
        (function () {
            var dialog = document.getElementById('print-dialog');
            var form = document.getElementById('print-form');
            var blank = document.getElementById('pr-blank');
            var count = document.getElementById('pr-blank-count');
            var blanks = document.getElementById('pr-blanks');
            document.getElementById('open-print').addEventListener('click', function () {
                document.getElementById('pr-subject').value = dialog.dataset.subject || '';
                document.getElementById('pr-class').value = dialog.dataset.class || '';
                document.getElementById('pr-date').value = dialog.dataset.date || '';
                document.getElementById('pr-topic').value = dialog.dataset.topic || '';
                dialog.showModal();
            });
            document.getElementById('close-print').addEventListener('click', function () { dialog.close(); });
            blank.addEventListener('change', function () { count.disabled = !blank.checked; });
            form.addEventListener('submit', function () {
                blanks.value = blank.checked ? count.value : 0;
                dialog.close();
            });
        })();
    </script>

    <p class="no-print">
        <button type="button" class="btn-print" onclick="window.print()" th:text="#{lesson.print}">Print</button>
    </p>

    <h1 th:text="${lesson.topic}">Topic</h1>
    <p class="lesson-meta">
        <span th:text="${subject.name}"></span>,
        <span th:text="#{lesson.title(${lesson.lessonNumber})}"></span>
        <span th:if="${lesson.plannedDate != null}"
              th:text="'· ' + ${#temporals.format(lesson.plannedDate, 'd MMMM yyyy, EEEE', enLocale)}"></span>
    </p>

    <nav class="lesson-nav no-print">
        <a th:if="${prevLesson != null}" th:href="@{/lesson/{id}(id=${prevLesson.id})}"
           th:text="'‹ ' + #{lesson.prev(${prevLesson.plannedDate != null ? #temporals.format(prevLesson.plannedDate, 'd MMM, EEE', enLocale) : ''})}"></a>
        <span th:if="${prevLesson == null}"></span>
        <a th:if="${nextLesson != null}" th:href="@{/lesson/{id}(id=${nextLesson.id})}"
           th:text="#{lesson.next(${nextLesson.plannedDate != null ? #temporals.format(nextLesson.plannedDate, 'd MMM, EEE', enLocale) : ''})} + ' ›'"></a>
    </nav>

    <section class="lesson-section" th:if="${!#strings.isEmpty(classworkStartHtml)}">
        <h2 th:text="#{lesson.classwork.start}">Classwork</h2>
        <div class="md" th:utext="${classworkStartHtml}"></div>
    </section>
    <section class="lesson-section" th:if="${!#strings.isEmpty(lectureHtml)}">
        <h2 th:text="#{lesson.lecture}">Lecture</h2>
        <div class="md" th:utext="${lectureHtml}"></div>
    </section>
    <section class="lesson-section" th:if="${!#strings.isEmpty(classworkJointHtml)}">
        <h2 th:text="#{lesson.classwork.joint}">Classwork</h2>
        <div class="md" th:utext="${classworkJointHtml}"></div>
    </section>
    <section class="lesson-section" th:if="${!#strings.isEmpty(classworkEndHtml)}">
        <h2 th:text="#{lesson.classwork.end}">Classwork</h2>
        <div class="md" th:utext="${classworkEndHtml}"></div>
    </section>
    <section class="lesson-section" th:if="${!#strings.isEmpty(homeworkHtml)}">
        <h2 th:text="#{lesson.homework}">Homework</h2>
        <p class="due" th:if="${homeworkDue != null}"
           th:text="#{lesson.homework.due(${#temporals.format(homeworkDue, 'EEEE, d MMMM', enLocale)})}"></p>
        <div class="md" th:utext="${homeworkHtml}"></div>
    </section>

    <section class="lesson-section no-print" id="grades" th:if="${isAdmin}">
        <h2 th:text="#{grades.title}">Grades</h2>
        <p th:if="${grades.isEmpty()}" th:text="#{grades.none}">No grades</p>
        <table class="grade-table" th:unless="${grades.isEmpty()}">
            <thead>
            <tr>
                <th th:text="#{grades.student}">Student</th>
                <th th:text="#{grades.score}">Score</th>
                <th th:text="#{grades.comment}">Comment</th>
                <th th:text="#{grades.when}">Time</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="g : ${grades}">
                <td th:text="${g.student.user.fullName}"></td>
                <td th:text="${g.score}"></td>
                <td th:text="${g.comment}"></td>
                <td th:text="${#temporals.format(g.dcre, 'd MMM HH:mm', enLocale)}"></td>
            </tr>
            </tbody>
        </table>
        <p><button type="button" id="open-grade" class="btn-fill" th:text="#{grades.add}">Add grade</button></p>

        <dialog id="grade-dialog" class="prompt-dialog">
            <h2 th:text="#{grades.add}">Add grade</h2>
            <form th:action="@{/admin/lesson/{id}/grades(id=${lesson.id})}" method="post" class="lesson-form">
                <label for="g-student" th:text="#{grades.student}">Student</label>


                <select id="g-student" name="studentId" class="fancy-select" required>
                    <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.user.fullName}"></option>
                </select>
                <label for="g-kind" th:text="#{grades.kind}">Type</label>
                <select id="g-kind" name="kind" class="fancy-select">
                    <option value="" th:selected="${lesson.lessonType != 'test'}"></option>
                    <option value="classwork_start">Independent work (start)</option>
                    <option value="classwork_end">Independent work (end)</option>
                    <option value="homework">Homework</option>
                    <option value="board">Board work</option>
                    <option value="test" th:selected="${lesson.lessonType == 'test'}">Test</option>
                    <option value="retake">Retake</option>
                </select>

                <label for="g-score" th:text="#{grades.score}">Score</label>
                <input id="g-score" type="number" name="score" min="0" max="100" required>
                <label for="g-comment" th:text="#{grades.comment}">Comment</label>
                <textarea id="g-comment" name="comment" rows="3"></textarea>
                <div class="form-buttons">
                    <button type="submit" class="btn-save" th:text="#{grades.save}">Save</button>
                    <button type="button" id="close-grade" th:text="#{grades.cancel}">Cancel</button>
                </div>
            </form>
        </dialog>
    </section>

    <p th:if="${#strings.isEmpty(lectureHtml) and #strings.isEmpty(classworkStartHtml) and #strings.isEmpty(classworkJointHtml) and #strings.isEmpty(classworkEndHtml) and #strings.isEmpty(homeworkHtml)}"
       th:text="#{lesson.nomaterials}">Not published</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ]
        });
        hljs.highlightAll();
    });
</script>
<script>
    (function () {
        var open = document.getElementById('open-grade');
        var dialog = document.getElementById('grade-dialog');
        if (!open || !dialog) { return; }
        open.addEventListener('click', function () { dialog.showModal(); });
        document.getElementById('close-grade').addEventListener('click', function () { dialog.close(); });
    })();
</script>
</body>
</html>
