<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{subject.title(${name}, ${className})}">Lesson plan</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/leaf.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="container">
    <h1 th:text="#{subject.title(${name}, ${className})}">Lesson plan</h1>
    <p th:if="${subject == null}" th:text="#{subject.noplan}">No lesson plan</p>
    <th:block th:if="${subject != null}"
              th:with="yearLabel=${subject.academicYear + '–' + #numbers.formatInteger((subject.academicYear + 1) % 100, 2)}">
        <p class="year" th:text="#{subject.year(${yearLabel})}">Academic year</p>
        <form th:if="${canEdit and needsReflow}" th:action="@{/manage/subject/{id}/reflow(id=${subject.id})}" method="post"
              class="reflow-form" onsubmit="return confirm('Recalculate the dates of the lessons that have not been held yet?');">
            <button type="submit" class="btn-fill" th:text="#{plan.reflow}">Reflow dates</button>
        </form>

        <form th:if="${canEdit}" th:action="@{/manage/subject/{id}/textbook(id=${subject.id})}"
              method="post" class="textbook-form">
            <label for="tb-title" th:text="#{textbook.title}">Title</label>
            <input id="tb-title" name="title" required th:value="${subject.textbook?.title}"
                   th:classappend="${#strings.isEmpty(subject.textbook?.title)} ? 'missing'">
            <label for="tb-authors" th:text="#{textbook.authors}">Authors</label>
            <input id="tb-authors" name="authors" th:value="${subject.textbook?.authors}"
                   th:classappend="${#strings.isEmpty(subject.textbook?.authors)} ? 'missing'">
            <label for="tb-publisher" th:text="#{textbook.publisher}">Publisher</label>
            <input id="tb-publisher" name="publisher" th:value="${subject.textbook?.publisher}"
                   th:classappend="${#strings.isEmpty(subject.textbook?.publisher)} ? 'missing'">
            <label for="tb-year" th:text="#{textbook.year}">Year</label>
            <input id="tb-year" name="publicationYear" type="number" th:value="${subject.textbook?.publicationYear}"
                   th:classappend="${#strings.isEmpty(subject.textbook?.publicationYear)} ? 'missing'">
            <label for="tb-isbn" th:text="#{textbook.isbn}">ISBN</label>
            <input id="tb-isbn" name="isbn" th:value="${subject.textbook?.isbn}"
                   th:classappend="${#strings.isEmpty(subject.textbook?.isbn)} ? 'missing'">
            <label for="tb-site" th:text="#{textbook.site}">Publisher website</label>
            <input id="tb-site" name="publisherUrl" th:value="${subject.textbook?.publisherUrl}"
                   th:classappend="${#strings.isEmpty(subject.textbook?.publisherUrl)} ? 'missing'">
            <label for="tb-file" th:text="#{textbook.file}">File link</label>
            <input id="tb-file" name="fileUrl" th:value="${subject.textbook?.fileUrl}"
                   th:classappend="${#strings.isEmpty(subject.textbook?.fileUrl)} ? 'missing'">
            <button type="submit" class="btn-save" th:text="#{textbook.save}">Save textbook</button>
        </form>
        <dl class="textbook" th:if="${!canEdit and subject.textbook != null}">
            <dt th:text="#{textbook.title}">Title</dt>
            <dd th:text="${subject.textbook.title}"></dd>
            <dt th:text="#{textbook.authors}">Authors</dt>
            <dd th:text="${subject.textbook.authors}"></dd>
            <dt th:text="#{textbook.publisher}">Publisher</dt>
            <dd th:text="${subject.textbook.publisher}"></dd>
            <dt th:text="#{textbook.year}">Year</dt>
            <dd th:text="${subject.textbook.publicationYear}"></dd>
            <dt th:text="#{textbook.isbn}">ISBN</dt>
            <dd th:text="${subject.textbook.isbn}"></dd>
            <dt th:if="${subject.textbook.publisherUrl != null}" th:text="#{textbook.site}">Website</dt>
            <dd th:if="${subject.textbook.publisherUrl != null}">
                <a th:href="${subject.textbook.publisherUrl}" th:text="${subject.textbook.publisherUrl}"></a>
            </dd>
        </dl>
        <div class="table-wrap">
            <table class="plan">
                <thead>
                <tr>
                    <th th:text="#{plan.weekcol}">Week</th>
                    <th th:text="#{plan.number}">No.</th>
                    <th th:text="#{plan.date}">Date</th>
                    <th th:text="#{plan.topic}">Topic</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="item : ${plan}">
                    <tr class="module-row" th:if="${item.kind() == 'module'}">
                        <td colspan="4" th:text="#{plan.module(${item.moduleNumber()})}"></td>
                    </tr>
                    <tr class="vacation-row" th:if="${item.kind() == 'vacation'}">
                        <td colspan="4"
                            th:text="#{plan.vacation(${#temporals.format(item.from(), 'd MMM', enLocale)}, ${#temporals.format(item.to(), 'd MMM', enLocale)})}"></td>
                    </tr>
                    <th:block th:if="${item.kind() == 'week'}">
                        <tr th:each="l, st : ${item.lessons()}" th:id="${'lesson-' + l.id}"
                            th:classappend="${'m' + l.plannedDate.monthValue + (l.lessonType != 'lesson' ? ' row-' + l.lessonType : '') + (l.id == currentId ? ' current' : '')}">
                            <td th:if="${st.first}" th:rowspan="${st.size}" class="week-cell"
                                th:classappend="${'m' + l.plannedDate.monthValue}">
                                <span class="vert" th:text="#{plan.week(${item.weekNumber()})}"></span>
                            </td>
                            <td th:text="${l.lessonNumber}"></td>
                            <td th:text="${#temporals.format(l.plannedDate, 'd MMM, EEE', enLocale)}"></td>
                            <td>
                                <a th:href="@{/lesson/{id}(id=${l.id})}" th:text="${l.topic != null} ? ${l.topic} : #{plan.notopic}"></a>
                                <span class="swap-buttons" th:if="${canEdit}">
                                    <form th:if="${swapRules.up().contains(l.id)}" method="post"
                                          th:action="@{/manage/subject/{sid}/lessons/{lid}/swap(sid=${subject.id},lid=${l.id})}">
                                        <input type="hidden" name="delta" value="-1">
                                        <button type="submit" th:title="#{plan.moveup}">▲</button>
                                    </form>
                                    <form th:if="${swapRules.down().contains(l.id)}" method="post"
                                          th:action="@{/manage/subject/{sid}/lessons/{lid}/swap(sid=${subject.id},lid=${l.id})}">
                                        <input type="hidden" name="delta" value="1">
                                        <button type="submit" th:title="#{plan.movedown}">▼</button>
                                    </form>
                                </span>
                            </td>
                        </tr>
                    </th:block>
                </th:block>
                </tbody>
            </table>
        </div>

        <div class="undated" th:if="${!undated.isEmpty()}">
            <p class="undated-title" th:text="#{plan.undated}"></p>
            <ul>
                <li th:each="l : ${undated}">
                    <span th:text="${l.lessonNumber}"></span>.
                    <a th:href="@{/lesson/{id}(id=${l.id})}"
                       th:text="${l.topic != null} ? ${l.topic} : #{plan.notopic}"></a>
                    <form th:if="${canEdit}" method="post" class="add-lesson-form"
                          th:action="@{/manage/subject/{sid}/lessons/{lid}/delete(sid=${subject.id},lid=${l.id})}"
                          th:attr="data-confirm=#{plan.delete.confirm}">
                        <button type="submit" class="btn-add-lesson" th:text="#{plan.delete}">Delete</button>
                    </form>
                </li>
            </ul>
        </div>

        <p class="approval">
            <span th:if="${subject.approvedBy != null}"
                  th:text="#{approval.done(${subject.approvedBy}, ${#temporals.format(subject.approvedOn, 'dd.MM.yyyy')})}"></span>
                    <span th:if="${subject.approvedBy == null}">
                <span th:text="#{approval.must}"></span>
            </span>
            <a th:if="${canApprove}" href="#" id="open-approval">✎</a>
        </p>
        <dialog id="approval-dialog" class="prompt-dialog" th:if="${canApprove}">
            <form th:action="@{/manage/subject/{id}/approval(id=${subject.id})}" method="post" class="lesson-form">
                <label for="a-by" th:text="#{approval.by}">Approved by</label>
                <input id="a-by" name="approvedBy" th:value="${subject.approvedBy}" required>
                <label for="a-on" th:text="#{approval.on}">Date</label>
                <input id="a-on" name="approvedOn" type="date" th:value="${subject.approvedOn}" required>
                <div class="form-buttons">
                    <button type="submit" class="btn-save" th:text="#{approval.save}">Save</button>
                    <button type="button" id="close-approval" th:text="#{approval.cancel}">Cancel</button>
                </div>
            </form>
        </dialog>
        <script th:if="${canApprove}">
            document.getElementById('open-approval').addEventListener('click', function (e) {
                e.preventDefault();
                document.getElementById('approval-dialog').showModal();
            });
            document.getElementById('close-approval').addEventListener('click', function () {
                document.getElementById('approval-dialog').close();
            });
        </script>
    </th:block>
</div>
<script>
    // scroll page to the current lesson
    var target = location.hash ? document.querySelector(location.hash) : document.querySelector('tr.current');
    if (target) { target.scrollIntoView({block: 'center'}); }
</script>
<script>
    // confirm to delete lesson
    document.querySelectorAll('form[data-confirm]').forEach(function (f) {
        f.addEventListener('submit', function (e) {
            if (!confirm(f.dataset.confirm)) { e.preventDefault(); }
        });
    });
</script>
</body>
</html>
