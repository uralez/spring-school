<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{app.title}">Spring School</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/leaf.svg}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <img class="logo" th:src="@{/img/leaf.svg}" alt="">
    <div>
      <div class="school-name" th:text="#{app.title}">Spring School</div>
      <div class="address" th:text="#{header.address}">Batumi</div>
    </div>
  </div>
</header>
<div class="container">
  <div class="summary">
    <div class="summary-today">
      <span th:text="#{summary.today(${#temporals.format(summary.date(), 'dd.MM.yyyy')})}"></span>:
      <b th:text="#{${'daytype.' + summary.dayType()}}"></b>
    </div>
    <div class="chips">
      <span class="chip" th:text="#{summary.day(${summary.dayNumber()}, ${summary.totalDays()})}"></span>
      <span class="chip" th:text="#{summary.week(${summary.weekNumber()}, ${summary.totalWeeks()})}"></span>
      <span class="chip" th:if="${summary.moduleNumber() != null}"
            th:text="#{summary.module(${summary.moduleNumber()}, ${summary.totalModules()})}"></span>
    </div>
  </div>
  <h1 th:text="#{timetable.title}">Timetable</h1>

  <div class="table-wrap">
    <table>
      <thead>
      <tr>
        <th th:text="#{timetable.time}">Time</th>
        <th th:each="d : ${#numbers.sequence(1,5)}" th:text="#{${'day.' + d}}">Day</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${timetable}">
        <td class="time">
          <span th:text="${#temporals.format(row.start(), 'HH:mm')}"></span>
          &ndash;
          <span th:text="${#temporals.format(row.end(), 'HH:mm')}"></span>
        </td>
        <td th:each="d : ${#numbers.sequence(1,5)}">
          <div class="lesson" th:each="lesson : ${row.lessons().get(d)}">
            <b th:text="${lesson.subjectName}"></b>
            <span class="groups" th:text="${#strings.setJoin(lesson.groups, ', ')}"></span>
            <small th:text="#{timetable.room(${lesson.classroom})}"></small>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
