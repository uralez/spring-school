<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{gradebook.title}">Grade book</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/leaf.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="container">
    <h1 th:text="#{gradebook.title}">Grade book</h1>
    <p th:if="${subjects.isEmpty()}" th:text="#{gradebook.none}">No subjects</p>
    <th:block th:if="${!subjects.isEmpty()}">
        <form method="get" th:action="@{/admin/grades}" class="gradebook-filter">
            <label for="subjectId" th:text="#{gradebook.subject}">Subject</label>
            <select id="subjectId" name="subjectId" class="fancy-select">
                <option th:each="s : ${subjects}" th:value="${s.id}" th:selected="${s.id == book.subject.id}"
                        th:text="${s.name + ' ' + s.classes[0].className}"></option>
            </select>
            <button type="submit" class="btn-fill" th:text="#{gradebook.show}">Show</button>
            <label class="switch">
                <input type="checkbox" id="hide-empty">
                <span class="slider"></span>
                <span th:text="#{gradebook.hide.empty}">Hide lessons without grades</span>
            </label>
        </form>

        <div class="table-wrap">
            <table class="gradebook">
                <thead>
                <tr>
                    <th th:text="#{gradebook.student}">Student</th>
                    <th th:each="l : ${book.lessons}"
                        th:classappend="${book.gradedLessons.contains(l.id) ? '' : 'no-grades'}">
                        <a th:href="@{/lesson/{id}(id=${l.id})}" th:text="${l.lessonNumber}"></a>
                        <div class="gb-date" th:text="${#temporals.format(l.plannedDate, 'd MMM', enLocale)}"></div>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${book.students}">
                    <td class="gb-name" th:text="${s.user.fullName}"></td>
                    <td th:each="l : ${book.lessons}"
                        th:classappend="${book.gradedLessons.contains(l.id) ? '' : 'no-grades'}"
                        th:text="${book.cells.get(s.id + ':' + l.id)}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </th:block>
</div>
<script>
    document.getElementById('hide-empty') && document.getElementById('hide-empty')
        .addEventListener('change', function () {
            document.querySelector('.gradebook').classList.toggle('hide-empty', this.checked);
        });
</script>
</body>
</html>
